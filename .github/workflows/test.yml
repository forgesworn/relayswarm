name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      soak:
        description: Run a longer, twelve-viewer peer-first test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docs:
    name: documentation and AI context
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node scripts/check-docs.mjs

  hls-playback:
    name: hls.js playback and field-test demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright-core install --with-deps chrome
      - run: npm run test:playback -- --chrome /opt/google/chrome/chrome --resultsDir playback-receipts
      - run: npm run test:operator -- --chrome /opt/google/chrome/chrome --resultsDir playback-receipts
      - run: npm run test:broadcast
      - run: npm run test:broadcast:browser -- --chrome /opt/google/chrome/chrome --resultsDir playback-receipts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hls-playback-receipts
          path: |
            playback-receipts/*.json
            artifacts/broadcast/integration.json

  hls-soak:
    name: hls.js optional twelve-viewer soak
    if: github.event_name == 'workflow_dispatch' && inputs.soak
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright-core install --with-deps chrome
      - run: npm run test:browser -- --chrome /opt/google/chrome/chrome --mode peer-first --viewers 12 --duration 180 --stagger 1000 --waves 3 --waveGap 30000 --maxPeers 4 --resultsDir soak-receipts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hls-soak-receipts
          path: soak-receipts/*.json

  hls-browser:
    name: hls.js (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [shadow, peer-first]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright-core install --with-deps chrome
      - run: npm run test:browser -- --chrome /opt/google/chrome/chrome --mode ${{ matrix.mode }} --viewers 6 --duration 30 --stagger 1000 --waves 2 --waveGap 15000 --maxPeers 4 --resultsDir browser-receipts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hls-${{ matrix.mode }}-receipt
          path: browser-receipts/hls-swarm-${{ matrix.mode }}-rotation-*.json

  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:native
      - run: npm run test:swarm
      - run: npm run test:publisher

  live-relays:
    name: browser transport against live relays
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit
      # Hits live Nostr relays; a red run here can mean relay weather, not a
      # code fault - re-run before concluding anything.
      - run: npm test
