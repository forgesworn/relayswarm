name: e2e

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      core_packages:
        description: Build native core artefacts only, without attaching a release
        type: boolean
        default: false
      soak:
        description: Run a longer, twelve-viewer peer-first test
        type: boolean
        default: false
      soak_duration:
        description: Measurement window in seconds (7200 includes repeated departures and rejoins)
        type: choice
        options: ['180', '7200']
        default: '180'

permissions:
  contents: read

env:
  # The three model regressions take about 287s on Windows because each
  # virtual millisecond yields to a real host timer. Keep both subsets required.
  WINDOWS_MODEL_TEST_PATTERN: >-
    ^(?:mixed planning keeps each holder's first byte and payload flow separate after cold startup|short or stale holder evidence receives bounded demand-bound refresh and can recover|an origin-winning abort invalidates unknown-flow continuation without charging a holder failure)$

jobs:
  docs:
    if: ${{ !inputs.core_packages }}
    name: documentation and AI context
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node scripts/check-docs.mjs

  hls-playback:
    if: ${{ !inputs.core_packages }}
    name: hls.js playback and field-test demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: scripts/ci-install-ffmpeg.sh
      - run: npx playwright-core install --with-deps chrome
      - run: npm run test:playback -- --chrome /opt/google/chrome/chrome --resultsDir playback-receipts
      - run: npm run test:playback:resume -- --chrome /opt/google/chrome/chrome --resultsDir playback-receipts
      - run: npm run test:operator -- --chrome /opt/google/chrome/chrome --resultsDir playback-receipts
      - run: CHROME_PATH=/opt/google/chrome/chrome npm run test:media-browser
      - run: CHROME_PATH=/opt/google/chrome/chrome npm run test:media-recovery
      - run: CHROME_PATH=/opt/google/chrome/chrome npm run test:live-recovery
      - run: CHROME_PATH=/opt/google/chrome/chrome npm run test:core-link:browser -- --receipt playback-receipts/core-link-native.json
      - run: CHROME_PATH=/opt/google/chrome/chrome npm run test:cached-peer-race:browser -- --receipt playback-receipts/cached-peer-race-native.json
      - run: CHROME_PATH=/opt/google/chrome/chrome npm run test:ticket-renewal:browser -- --receipt playback-receipts/ticket-renewal-native.json
      - run: npm run test:broadcast
      - run: npm run test:broadcast:browser -- --chrome /opt/google/chrome/chrome --resultsDir playback-receipts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hls-playback-receipts
          path: |
            playback-receipts/*.json
            artifacts/broadcast/integration.json
            artifacts/browser-production-*/*.json
            artifacts/fmp4-browser/*.json
            artifacts/media-browser/*.json
            artifacts/ll-browser/*.json
            artifacts/media-recovery-browser/*.json
            artifacts/sparse-aac-recovery-browser/*.json
            artifacts/live-restart-browser/**/*.json

  swift-interop:
    if: ${{ !inputs.core_packages }}
    name: current Swift SDK and browser interoperability
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: forgesworn/relayswarm-kit
          ref: f312c0a0229397050dd115aa4c854d31477f665d
          path: .interop-sdk
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: brew list ffmpeg >/dev/null || brew install ffmpeg
      - run: npx playwright-core install chrome
      - run: npm run test:interop:kit -- --evidence artifacts/current-sdk-browser-ci.json
        env:
          RELAYSWARM_KIT_DIR: .interop-sdk
      - run: npm run test:interop:kit -- --pieces --evidence artifacts/current-sdk-pieces-browser-ci.json
        env:
          RELAYSWARM_KIT_DIR: .interop-sdk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: current-sdk-browser-interop
          path: |
            artifacts/current-sdk-browser-ci.json
            artifacts/current-sdk-pieces-browser-ci.json
            artifacts/current-sdk-*-failure.json

  hls-soak:
    name: hls.js optional twelve-viewer soak
    if: github.event_name == 'workflow_dispatch' && inputs.soak && !inputs.core_packages
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: scripts/ci-install-ffmpeg.sh
      - run: npx playwright-core install --with-deps chrome
      - run: npm run test:browser -- --chrome /opt/google/chrome/chrome --mode peer-first --viewers 12 --duration "${{ inputs.soak_duration }}" --churnEvery 600 --churnCount 2 --stagger 1000 --waves 3 --waveGap 30000 --maxPeers 4 --resultsDir soak-receipts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hls-soak-receipts
          path: soak-receipts/*.json

  hls-browser:
    if: ${{ !inputs.core_packages }}
    name: hls.js (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        mode: [shadow, peer-first]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: scripts/ci-install-ffmpeg.sh
      - run: npx playwright-core install --with-deps chrome
      - run: npm run test:browser -- --chrome /opt/google/chrome/chrome --mode ${{ matrix.mode }} --viewers 6 --duration 30 --stagger 1000 --waves 2 --waveGap 15000 --maxPeers 4 --resultsDir browser-receipts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hls-${{ matrix.mode }}-receipt
          path: browser-receipts/hls-swarm-${{ matrix.mode }}-rotation-*.json

  native:
    if: ${{ !inputs.core_packages }}
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test test/fixture-ice.test.mjs
      - run: npm run test:native
      - run: npm run test:swarm
        if: runner.os != 'Windows'
      - name: Swarm tests outside the Windows model subset
        if: runner.os == 'Windows'
        shell: bash
        run: node --test --test-skip-pattern "$WINDOWS_MODEL_TEST_PATTERN" test/hls-swarm.test.mjs test/browser-hardening.test.mjs test/stream-discovery.test.mjs test/origin-range.test.mjs
      - run: npm run test:publisher

  windows-model:
    if: ${{ !inputs.core_packages }}
    name: native Windows model regressions
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Three measured long-running model regressions
        shell: bash
        run: node --test --test-name-pattern "$WINDOWS_MODEL_TEST_PATTERN" test/browser-hardening.test.mjs

  rust-core:
    if: ${{ !inputs.core_packages }}
    name: Rust core and shared vectors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:proto
      - run: npm run proto:traces
      - name: Rust format, lint, test and WebAssembly build
        working-directory: core
        env:
          RELAYSWARM_REQUIRE_JS_TRACES: '1'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --target wasm32-unknown-unknown -p relayswarm-proto
      # The committed module is checked by test:proto above, including its
      # stamp of the core/ sources it was built from. A fresh build from this
      # commit must give the same verdicts; its bytes may differ by host.
      - name: Fresh WebAssembly module against the shared vectors
        run: |
          node scripts/build-core-wasm.mjs --out "$RUNNER_TEMP/relayswarm-core.wasm"
          RELAYSWARM_CORE_WASM="$RUNNER_TEMP/relayswarm-core.wasm" node --test test/core-wasm.test.mjs test/core-link.test.mjs test/core-transfer.test.mjs
      # Once, on Linux: the suite's timing tests are tight enough that running
      # it twice per Windows job doubles their chance of a slow-runner miss.
      - name: Loader suite with links, selection and verification in the Rust core
        run: npm run test:swarm:core
      # The runner image ships Swift, so the UniFFI bindings compile and run
      # against the shared vectors and link traces here, not only on a Mac.
      - name: Swift bindings through UniFFI
        run: |
          swift --version
          npm run test:ffi:swift
      # The image ships kotlinc and a JDK; JNA comes pinned from Maven Central.
      # Runs after a Swift failure too, so each run reports both bindings.
      - name: Kotlin bindings through UniFFI
        if: ${{ !cancelled() }}
        run: |
          kotlinc -version
          npm run test:ffi:kotlin

  apple-package:
    if: ${{ !inputs.core_packages }}
    name: Apple package of the Rust core
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run proto:traces
      # In core/, so the targets go to the toolchain rust-toolchain.toml pins.
      - name: Rust targets for iPhone, the simulator and macOS
        working-directory: core
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin
      # Builds the XCFramework and package, links the smoke for iPhone and
      # runs it on macOS and in an iPhone simulator.
      - name: Package, link and replay
        run: |
          xcodebuild -version
          npm run test:ffi:apple

  android-package:
    if: ${{ !inputs.core_packages }}
    name: Android library of the Rust core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # In core/, so the targets go to the toolchain rust-toolchain.toml pins.
      - name: Rust targets and cargo-ndk
        working-directory: core
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install --locked cargo-ndk --version 4.1.2
      # The image ships the SDK, NDKs, kotlinc and Gradle. Builds the AAR and
      # an app against it; the emulator run stays local.
      - name: Package and build an app against it
        run: |
          echo "SDK $ANDROID_HOME, NDK ${ANDROID_NDK_HOME:-newest under the SDK}"
          kotlinc -version
          gradle --version
          npm run test:ffi:android

  live-relays:
    if: ${{ !inputs.core_packages }}
    name: browser transport against live relays
    needs: [native, windows-model]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit
      # Hits live Nostr relays; a red run here can mean relay weather, not a
      # code fault - re-run before concluding anything.
      - run: npm test

  core-release-packages:
    name: native core release packaging
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.core_packages)
    permissions:
      contents: write
    uses: ./.github/workflows/core-packages.yml
    with:
      publish: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
