[workspace]
resolver = "2"
members = ["relayswarm-proto", "relayswarm-wasm", "relayswarm-ffi"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true

# Piece and object digests run on the player's main thread. At "z" SHA-256
# is about twice as slow, for under 1 KB of compressed module size.
[profile.release.package.sha2]
opt-level = 3
