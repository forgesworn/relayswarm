[package]
name = "relayswarm-wasm"
version = "0.0.0"
description = "WebAssembly bindings for the RelaySwarm core"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
relayswarm-proto = { path = "../relayswarm-proto" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# Must equal the wasm-bindgen CLI version exactly.
wasm-bindgen = "=0.2.129"
