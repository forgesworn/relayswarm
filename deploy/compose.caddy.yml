# Only for a host without an HTTPS proxy. Requires explicit overlay AND profile.
services:
  https:
    image: caddy:2.11.7@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    profiles: [standalone-https]
    restart: unless-stopped
    depends_on: [app]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to your dedicated HTTPS hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy-config:/config
    networks: [egress]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
volumes:
  certificates: {}
  proxy-config: {}
